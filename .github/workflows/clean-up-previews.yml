name: Clean Up Previews

# Deletes the preview branch, its caches, and the published Storybook of every
# pull request that has been closed or merged.
on:
    schedule:
        - cron: '41 4 * * 1'
    workflow_dispatch:

permissions: {}

jobs:
    clean-up:
        if: ${{ github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            actions: write
        # Serialize with deploys so a rewrite of gh-pages drops no new preview.
        concurrency:
            group: gh-pages
            cancel-in-progress: false
        steps:
            - name: Checkout gh-pages
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: gh-pages
                  path: gh-pages
                  persist-credentials: false

            - name: Delete closed pull requests
              id: delete
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  mkdir site
                  git -C gh-pages archive HEAD | tar -x -C site

                  {
                      gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/preview/pr-" \
                          --jq '.[].ref | sub("^refs/heads/preview/pr-"; "")'
                      find site -mindepth 1 -maxdepth 1 -type d -name 'pr-*' -printf '%f\n' | sed 's/^pr-//'
                  } | { grep -E '^[0-9]+$' || true; } | sort -un > numbers.txt

                  removed=0
                  while read -r PR; do
                      STATE="$(gh api "repos/WordPress/gutenberg/pulls/$PR" --jq .state 2> /dev/null || true)"
                      if [ "$STATE" != 'closed' ]; then
                          continue
                      fi
                      echo "Deleting preview of WordPress/gutenberg#$PR"
                      if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/preview/pr-$PR" > /dev/null 2>&1; then
                          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/preview/pr-$PR"
                      fi
                      gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?ref=refs/heads/preview/pr-$PR" \
                          --jq '.actions_caches[].id' | while read -r ID; do
                          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$ID"
                      done
                      if [ -d "site/pr-$PR" ]; then
                          rm -rf "site/pr-$PR"
                          removed=1
                      fi
                  done < numbers.txt

                  echo "removed=$removed" >> "$GITHUB_OUTPUT"

            # Replaces gh-pages with a single orphan commit so deleted previews leave no history.
            - name: Deploy
              if: ${{ steps.delete.outputs.removed == '1' }}
              uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./site
                  force_orphan: true
                  commit_message: 'Clean up previews of closed pull requests'
