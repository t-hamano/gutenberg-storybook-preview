name: Storybook Preview
run-name: 'Storybook Preview #${{ inputs.pull_request_number }}'

on:
    workflow_dispatch:
        inputs:
            pull_request_number:
                required: true
                type: string

permissions: {}

jobs:
    dispatch:
        name: Start build for PR #${{ inputs.pull_request_number }}
        if: ${{ github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-24.04
        # Never checks out or runs pull request code.
        permissions:
            contents: write
            actions: write
        concurrency:
            group: preview-pr-${{ inputs.pull_request_number }}
            cancel-in-progress: false
        steps:
            - name: Validate PR number
              env:
                  PR: ${{ inputs.pull_request_number }}
              run: |
                  if [[ ! "$PR" =~ ^[0-9]+$ ]]; then
                      echo "::error::PR must be a number, got '$PR'."
                      exit 1
                  fi

            # The build runs on its own branch so the cache scope of the pull request's code
            # is that branch, not main. Recreate the branch at the tip of main so it runs
            # the current workflows.
            - name: Point preview branch at main
              env:
                  GH_TOKEN: ${{ github.token }}
                  BRANCH: preview/pr-${{ inputs.pull_request_number }}
              run: |
                  SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
                  if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" > /dev/null 2>&1; then
                      gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
                  fi
                  gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                      -f ref="refs/heads/$BRANCH" -f sha="$SHA" > /dev/null

            - name: Start build
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR: ${{ inputs.pull_request_number }}
              run: |
                  gh workflow run build-storybook-preview.yml --repo "$GITHUB_REPOSITORY" \
                      --ref "preview/pr-$PR" -f pull_request_number="$PR"

            - name: Summary
              env:
                  PR: ${{ inputs.pull_request_number }}
                  SERVER: ${{ github.server_url }}
              run: |
                  {
                      echo "### Building Storybook for WordPress/gutenberg#$PR"
                      echo
                      echo "Follow the build in [Build Storybook Preview]($SERVER/$GITHUB_REPOSITORY/actions/workflows/build-storybook-preview.yml)."
                  } >> "$GITHUB_STEP_SUMMARY"
